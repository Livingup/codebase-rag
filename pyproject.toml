[project]
name = "codebase-rag"
version = "0.1.0"
description = "Codebase RAG - Git-aware semantic code knowledge base"
requires-python = ">=3.11"
dependencies = [
    # --- Qdrant ---
    # 客户端与服务端 major 必须一致且 minor 相差不超过 1（当前服务端 1.17.x）。
    "qdrant-client>=1.12.0,<1.19.0",

    # --- LLM / Embedding ---
    "httpx>=0.27.0",
    "tiktoken>=0.8.0",
    # 统一 LLM/Embedding 协议客户端（Agent 多协议与 Gemini 纯稠密/多模态向量）
    "multi-protocol-llm-client>=1.0.0",

    # --- Web 框架 ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiohttp>=3.10.0",

    # --- MCP ---
    "mcp>=1.18.0,<2.0.0",

    # --- 配置 ---
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "watchfiles>=1.0.0",

    # --- 文件过滤（.gitignore 语法，GitWildMatch） ---
    "pathspec>=1.1.0",

    # --- 调度 ---
    "apscheduler>=3.10.0",

    # --- 日志 ---
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
codebase-rag = "codebase_rag.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_rag"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: hits real external APIs, requires API keys in .env (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.11"
strict = true
