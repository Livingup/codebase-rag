    # Layer 3 灰区 LLM 判断
    uncertain:
      enabled: true
      binary_detection: true
      classify_batch_size: 50
      store_path: "${CODEBASE_RAG_DATA_DIR}/data/gray_area_classifications.json"  # 灰区分类经验持久化

# --- 08-工作流编排服务 ---
workflow:
  data_dir: "${CODEBASE_RAG_DATA_DIR}/data"             # 重试队列/死信队列持久化目录
  initialization:
    mode: "incremental"          # "incremental" = 仅跟踪增量（默认） | "full" = 全量初始化
    max_file_concurrency: 5     # 全量初始化时并发处理的文件数（通过 asyncio.Semaphore 控制）

  knowledge_producer:                   # 源码业务描述生成 agent 的 LLM 负载配置
    timeout: 3600                        # agent 超时（秒）
    max_points_per_call: 10              # 单次工具调用最多创建的知识点数量
    max_rate_limit_retries: 1            # 单 key 429 重试上限；-1 = 无限（受 timeout 约束）
    providers:                          # 服务商队列：按 priority 升序排列，值越小优先级越高
      - provider: "deepseek"
        model: "deepseek-v4-flash"
        priority: 50
      - provider: "deepseek"
        model: "deepseek-v4-pro"
        priority: 60
      - provider: "openai_compatible_secondary"
        model: "gpt-5.4"
        priority: 70
  gray_area_classifier:                 # 灰区文件分类 agent 的 LLM 负载配置
    timeout: 30                         # agent 超时（秒）
    max_rate_limit_retries: 1            # 单 key 429 重试上限；-1 = 无限（受 timeout 约束）
    providers:                          # 服务商队列：按 priority 升序排列，值越小优先级越高
      - provider: "deepseek"
        model: "deepseek-v4-flash"
        priority: 50
      - provider: "deepseek"
        model: "deepseek-v4-pro"
        priority: 60
      - provider: "openai_compatible_secondary"
        model: "gpt-5.4"
        priority: 70
  compensation:                           # 失败文件补偿任务配置
    enabled: true                         # 是否启用后台补偿
    scan_interval: 60                     # 扫描间隔基准（秒）
    base_backoff: 30                      # 退避基准时长（秒）
    max_backoff: 1800                     # 退避上限（秒，默认30分钟）
    batch_size: 10                        # 每轮最多处理文件数
    max_file_retries: 50                  # 单文件最大重试次数，超过后归档死信队列

# --- 11-Context Engine 服务 ---
context_engine:
  providers:                            # 服务商队列：按 priority 升序排列，值越小优先级越高
    - provider: "deepseek"
      model: "deepseek-v4-pro"
      priority: 10
    - provider: "openai_compatible_secondary"
      model: "gpt-5.4"
      priority: 20
  max_rate_limit_retries: 20           # 单 key 429 重试上限；-1 = 无限（受 timeout 约束）
  mcp_servers:                         # 需要接入的 MCP 服务（key 对应 mcp_client.servers）
    codebase_rag:
      include_tools:                   # 工具白名单（不配置或为空 → 引入该服务所有工具）
        - "codebase_search"
  rg_timeout: 10                       # 单次 ripgrep 子进程超时（秒）
  max_file_read_lines: 500             # 单次 read_file 最大行数（超过则截断）

# --- MCP Client 服务 ---
mcp_client:
  servers:
    codebase_rag:                               # 本系统的 MCP Server（codebase_search 等）
      transport: "streamable_http"              # 传输协议：streamable_http / sse / stdio
      url: "http://127.0.0.1:19090/mcp"         # MCP 端点 URL（与 mcp.servers 配置一致）
      headers: {}                               # 自定义请求头（认证等）
      timeout: 300                              # 请求超时（秒），codebase_search 含 LLM 重排序
    # --- HTTP MCP Server 示例 ---
    # remote_tools:
    #   transport: "streamable_http"
    #   url: "http://localhost:29090/mcp"
    #   headers:
    #     Authorization: "Bearer your-token"
    #   timeout: 30
    # --- stdio MCP Server 示例 ---
    # local_tools:
    #   transport: "stdio"
    #   command: "npx"
    #   args: ["-y", "@some/mcp-server"]
    #   env:
    #     API_KEY: "your-api-key"
    #   timeout: 30

# --- 10-MCP 服务 ---
mcp:
  servers:
    codebase_rag:                         # 服务 ID
      host: "127.0.0.1"
      port: 19090
      name: "codebase-rag"               # MCP 协议元数据：服务名称
      version: "1.0.0"                   # MCP 协议元数据：服务版本
      # 同一端口同时提供两种传输：
      #   SSE (legacy):       GET /sse + POST /messages   → 客户端 URL: http://host:port/sse
      #   Streamable HTTP:    POST|GET|DELETE /mcp         → 客户端 URL: http://host:port/mcp
    # --- 未来扩展示例 ---
    # drawing:
    #   host: "127.0.0.1"
    #   port: 19091
    #   name: "drawing-service"
    #   version: "1.0.0"
  reranker:
    providers:                            # 服务商队列：按 priority 升序排列，值越小优先级越高
      - provider: "deepseek"
        model: "deepseek-v4-flash"
        priority: 50
      - provider: "deepseek"
        model: "deepseek-v4-pro"
        priority: 60
      - provider: "openai_compatible_secondary"
        model: "gpt-5.4"
        priority: 70
    recall_limit: 80                    # Stage 1 向量召回最大候选数
    timeout: 3600                         # 重排序 agent 超时（秒）
    max_rate_limit_retries: 1            # 单 key 429 重试上限；-1 = 无限（受 timeout 约束）
  knowledge_submission:
    point_token_limit: 2048              # 单条知识描述最大 tokens
