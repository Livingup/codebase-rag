# =============================================================================
# Codebase RAG — 配置文件模板
# 复制为 config.yaml 并填入实际值后使用
# curl -X POST http://127.0.0.1:18080/api/v1/config/reload
# =============================================================================

system:
  data_dir: "${CODEBASE_RAG_DATA_DIR}"
  log:
    level: "INFO"
    format: "text"                         # "json" 或 "text"
    file: "${CODEBASE_RAG_DATA_DIR}/logs/app.log"                  # 普通日志文件，支持实时查看
    error_file: "${CODEBASE_RAG_DATA_DIR}/logs/error.log"         # WARNING + ERROR 专用日志文件
    retention_days: 1                      # 普通日志保留天数
    max_bytes: 52428800                    # 错误日志分片：单文件最大字节数（默认 50MB）
    backup_count: 5                        # 错误日志分片：保留备份文件数

# --- 04-Embedding 服务 ---
embedding:
  dense:
    active_provider: "gemini"
    providers:
      gemini:
        api_base_url: "https://generativelanguage.googleapis.com"
        model_name: "gemini-embedding-001"
        dimension: 3072
        batch_size: 100
        max_tokens_per_text: 2048
        request_timeout: 30
        api_keys:
          - key: "${GEMINI_EMBED_KEY_1}"
        retry:
          max_retries_per_key: 3
          retry_base_delay: 1.0
          retry_backoff_multiplier: 2.0
          key_cooldown_seconds: 60

  sparse:
    active_provider: "dashscope"
    providers:
      dashscope:
        api_base_url: "https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding"
        model_name: "text-embedding-v4"
        dimension: 2048
        batch_size: 10
        max_tokens_per_text: 2048
        request_timeout: 30
        api_keys:
          - key: "${DASHSCOPE_API_KEY}"
        retry:
          max_retries_per_key: 3
          retry_base_delay: 1.0
          retry_backoff_multiplier: 2.0
          key_cooldown_seconds: 60

  max_concurrency: 3

# --- 01-Qdrant 存储服务 ---
qdrant_storage:
  connection:
    host: "${QDRANT_HOST}"               # Qdrant 服务地址，真实值存放在私有 .env
    port: ${QDRANT_PORT}                  # Qdrant REST 端口，真实值存放在私有 .env
    grpc_port: ${QDRANT_GRPC_PORT}        # Qdrant gRPC 端口，真实值存放在私有 .env
    prefer_grpc: false                   # 公网链路通常优先 HTTP；按实际部署调整
    https: ${QDRANT_HTTPS}
    timeout: 60                          # 外部服务链路超时（秒）
    api_key: "${QDRANT_API_KEY}"         # Qdrant 鉴权密钥，存放在私有 .env
  collection:
    name: "codebase"
    dense_vector:
      name: "dense_vectors"
      size: 3072                           # 必须与 embedding dense dimension 一致
      distance: "Cosine"
    sparse_vector:
      name: "sparse_vectors"               # 必须与已有集合一致

# --- 02-内存 Qdrant 服务 ---
memory_qdrant:
  cache:
    max_branches: 5
    idle_timeout_minutes: 720             # 活跃实例空闲超时（分钟），超时后释放内存，下次搜索自动重建。0=永不释放
  instance:
    dense_vector:
      name: "dense_vectors"
      size: 3072                           # 必须与上方一致
      distance: "Cosine"
    sparse_vector:
      name: "sparse_vectors"               # 必须与上方一致

