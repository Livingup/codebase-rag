# --- 05-事件检测服务 ---
event_detection:
  hook_receiver:
    mode: "http"                        # "http" | "named_pipe"
    http:
      host: "127.0.0.1"
      port: 9876
      endpoint: "/hook"
    named_pipe:
      path: "\\\\.\\pipe\\codebase-rag-hook"  # Windows Named Pipe
      # path: "/tmp/codebase-rag-hook.sock"   # Unix Domain Socket
  watcher:
    enabled: false                      # 兜底文件系统监听
    debounce_ms: 500                    # 防抖窗口（毫秒）
    watch_paths:                        # 相对于 .git/ 的监听路径
      - "HEAD"
      - "refs/heads/"
      - "MERGE_HEAD"
      - "REBASE_HEAD"
  dedup:
    window_ms: 1000                     # 去重窗口（毫秒），hook + watcher 合并为一次

# --- 06-管理 API 服务 ---
management_api:
  server:
    host: "127.0.0.1"
    port: 18080
  admin_ui:
    enabled: true                         # 本机免密管理后台，页面入口：http://127.0.0.1:18080/ 或 /admin
  client_status:
    live_probe_enabled: false             # 默认只读当前健康快照；实时检测需用户手动触发，避免自动消耗外部 API 额度
    live_probe_timeout: 10                # 单个客户端实时心跳超时（秒）
  registry_path: "${CODEBASE_RAG_DATA_DIR}/data/project_registry.json"  # 项目注册表持久化路径，重启自动恢复

